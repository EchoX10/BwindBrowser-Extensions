name: Publicar atualizações do B-wind

on:
  push:
    paths:
      - 'BwindBrowser_Upgrades_*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descompactar e publicar atualização
        run: |
          set -e
          ARCHIVE="$(find . -maxdepth 1 -name 'BwindBrowser_Upgrades_*.zip' -print | sort | tail -n 1)"
          if [ -z "$ARCHIVE" ]; then
            echo "Nenhum pacote de atualização foi encontrado."
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/bwind-upgrade"
          mkdir -p "$RUNNER_TEMP/bwind-upgrade"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/bwind-upgrade"
          test -f "$RUNNER_TEMP/bwind-upgrade/BrowserUpgrades/catalog.json"
          APK_COUNT="$(find "$RUNNER_TEMP/bwind-upgrade/BrowserUpgrades" -maxdepth 1 -name '*.apk' -type f | wc -l)"
          if [ "$APK_COUNT" -lt 1 ] || [ "$APK_COUNT" -gt 2 ]; then
            echo "O pacote deve conter um APK estável e, opcionalmente, um APK beta; encontrados: $APK_COUNT"
            exit 1
          fi
          if [ -f "$RUNNER_TEMP/bwind-upgrade/BrowserUpgrades/beta_catalog.json" ] && [ "$APK_COUNT" -ne 2 ]; then
            echo "beta_catalog.json exige um segundo APK beta no mesmo pacote."
            exit 1
          fi
          rm -rf BrowserUpgrades
          cp -R "$RUNNER_TEMP/bwind-upgrade/BrowserUpgrades" ./BrowserUpgrades
          git config user.name "B-wind Browser Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BrowserUpgrades
          if git diff --cached --quiet; then
            echo "O canal de atualização já está atualizado."
            exit 0
          fi
          git commit -m "Publicar atualização do B-wind Browser"
          for attempt in 1 2 3 4 5; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
              echo "Atualização publicada na tentativa $attempt."
              exit 0
            fi
            echo "Conflito de concorrência na tentativa $attempt; aguardando e tentando novamente."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 4))
            git fetch origin main
            git rebase origin/main
          done
          echo "Não foi possível publicar após cinco tentativas."
          exit 1
