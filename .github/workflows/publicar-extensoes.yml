name: Publicar catálogo de extensões



on:

  push:
  
    paths:
    
      - 'BwindBrowser_Extensions_*.zip'
      
  workflow_dispatch:
  


permissions:

  contents: write
  


jobs:

  publicar:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Baixar repositório
      
        uses: actions/checkout@v4
        


      - name: Descompactar e publicar catálogo
      
        run: |
        
          ARCHIVE="$(find . -maxdepth 1 -name 'BwindBrowser_Extensions_*.zip' -print | sort | tail -n 1)"
          
          if [ -z "$ARCHIVE" ]; then
          
            echo "Nenhum pacote de extensões foi encontrado."
            
            exit 1
            
          fi
          
          rm -rf "$RUNNER_TEMP/bwind-unpack"
          
          mkdir -p "$RUNNER_TEMP/bwind-unpack"
          
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/bwind-unpack"
          
          rm -rf Extensions
          
          cp -R "$RUNNER_TEMP/bwind-unpack/Extensions" ./Extensions
          
          git config user.name "B-wind Browser Bot"
          
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Extensions
          
          if git diff --cached --quiet; then
          
            echo "O catálogo já está atualizado."
            
          else
          
            git commit -m "Publicar catálogo de extensões"
            
            git push
            
          fi
          































